<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, sans-serif">
  <!-- Title -->
  <text x="40" y="45" font-size="28" font-weight="800" fill="#2A2017">PawTrack Color Palette</text>

  <!-- Primary -->
  <text x="40" y="90" font-size="14" font-weight="600" fill="#9E9189" letter-spacing="1">PRIMARY</text>

  <rect x="40" y="105" width="140" height="100" rx="12" fill="#B5633B"/>
  <text x="110" y="165" font-size="13" font-weight="700" fill="white" text-anchor="middle">Terracotta</text>
  <text x="110" y="185" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">#B5633B</text>

  <rect x="195" y="105" width="140" height="100" rx="12" fill="#F5E6DB"/>
  <text x="265" y="165" font-size="13" font-weight="700" fill="#8C4A2B" text-anchor="middle">Terra Light</text>
  <text x="265" y="185" font-size="11" fill="#9E9189" text-anchor="middle">#F5E6DB</text>

  <rect x="350" y="105" width="140" height="100" rx="12" fill="#8C4A2B"/>
  <text x="420" y="165" font-size="13" font-weight="700" fill="white" text-anchor="middle">Terra Dark</text>
  <text x="420" y="185" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">#8C4A2B</text>

  <!-- Secondary -->
  <text x="40" y="245" font-size="14" font-weight="600" fill="#9E9189" letter-spacing="1">SECONDARY</text>

  <rect x="40" y="260" width="140" height="100" rx="12" fill="#C4882A"/>
  <text x="110" y="320" font-size="13" font-weight="700" fill="white" text-anchor="middle">Amber</text>
  <text x="110" y="340" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">#C4882A</text>

  <rect x="195" y="260" width="140" height="100" rx="12" fill="#5A9E6F"/>
  <text x="265" y="320" font-size="13" font-weight="700" fill="white" text-anchor="middle">Sage</text>
  <text x="265" y="340" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">#5A9E6F</text>

  <rect x="350" y="260" width="140" height="100" rx="12" fill="#8B5A9E"/>
  <text x="420" y="320" font-size="13" font-weight="700" fill="white" text-anchor="middle">Plum</text>
  <text x="420" y="340" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">#8B5A9E</text>

  <rect x="505" y="260" width="140" height="100" rx="12" fill="#D94F3D"/>
  <text x="575" y="320" font-size="13" font-weight="700" fill="white" text-anchor="middle">Coral</text>
  <text x="575" y="340" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">#D94F3D</text>

  <!-- Neutrals -->
  <text x="40" y="400" font-size="14" font-weight="600" fill="#9E9189" letter-spacing="1">NEUTRALS</text>

  <rect x="40" y="415" width="100" height="80" rx="12" fill="#F5F0EB" stroke="#E8E0D8"/>
  <text x="90" y="460" font-size="11" font-weight="700" fill="#6B5D52" text-anchor="middle">Sand</text>
  <text x="90" y="478" font-size="10" fill="#9E9189" text-anchor="middle">#F5F0EB</text>

  <rect x="155" y="415" width="100" height="80" rx="12" fill="#FDFCFA" stroke="#E8E0D8"/>
  <text x="205" y="460" font-size="11" font-weight="700" fill="#6B5D52" text-anchor="middle">Warm White</text>
  <text x="205" y="478" font-size="10" fill="#9E9189" text-anchor="middle">#FDFCFA</text>

  <rect x="270" y="415" width="100" height="80" rx="12" fill="#2A2017"/>
  <text x="320" y="460" font-size="11" font-weight="700" fill="white" text-anchor="middle">Primary</text>
  <text x="320" y="478" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">#2A2017</text>

  <rect x="385" y="415" width="100" height="80" rx="12" fill="#6B5D52"/>
  <text x="435" y="460" font-size="11" font-weight="700" fill="white" text-anchor="middle">Secondary</text>
  <text x="435" y="478" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">#6B5D52</text>

  <rect x="500" y="415" width="100" height="80" rx="12" fill="#9E9189"/>
  <text x="550" y="460" font-size="11" font-weight="700" fill="white" text-anchor="middle">Tertiary</text>
  <text x="550" y="478" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">#9E9189</text>

  <rect x="615" y="415" width="100" height="80" rx="12" fill="#E8E0D8"/>
  <text x="665" y="460" font-size="11" font-weight="700" fill="#6B5D52" text-anchor="middle">Border</text>
  <text x="665" y="478" font-size="10" fill="#9E9189" text-anchor="middle">#E8E0D8</text>

  <!-- Paw print watermark -->
  <g opacity="0.06" transform="translate(620, 60)">
    <ellipse cx="35" cy="22" rx="13" ry="15" fill="#B5633B" transform="rotate(-12 35 22)"/>
    <ellipse cx="65" cy="22" rx="13" ry="15" fill="#B5633B" transform="rotate(12 65 22)"/>
    <ellipse cx="20" cy="50" rx="11" ry="13" fill="#B5633B" transform="rotate(-25 20 50)"/>
    <ellipse cx="80" cy="50" rx="11" ry="13" fill="#B5633B" transform="rotate(25 80 50)"/>
    <ellipse cx="50" cy="68" rx="24" ry="21" fill="#B5633B"/>
  </g>
</svg>
